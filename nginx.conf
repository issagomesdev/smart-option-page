# Serves the static Vite build produced by Dockerfile.prod. Listens on 80 internally — the
# publicly reachable port is controlled by APP_PORT in docker-compose.prod.yml, not here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # Long-lived caching for hashed build assets; index.html itself stays revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
