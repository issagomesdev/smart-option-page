name: smart-option-page

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_GITHUB_URL: ${VITE_GITHUB_URL}
        VITE_BOT_DEMO_URL: ${VITE_BOT_DEMO_URL}
        VITE_ADMIN_DEMO_URL: ${VITE_ADMIN_DEMO_URL}
        VITE_LINKEDIN_URL: ${VITE_LINKEDIN_URL}
        VITE_PORTFOLIO_URL: ${VITE_PORTFOLIO_URL}
        VITE_DEVELOPER_EMAIL: ${VITE_DEVELOPER_EMAIL}
        VITE_DEVELOPER_PHOTO_URL: ${VITE_DEVELOPER_PHOTO_URL}
        VITE_CURRICULUM_API_URL: ${VITE_CURRICULUM_API_URL}
    restart: unless-stopped
    # Publicada SEMPRE em 127.0.0.1, nunca em 0.0.0.0. O Docker escreve as próprias regras de
    # iptables e passa por cima do UFW: sem o prefixo de loopback, o site fica servido também em
    # http://IP-DA-VPS:${APP_PORT} — sem TLS, fora do domínio canônico e sem passar pelo proxy —
    # com o `ufw status` continuando a mostrar a porta como bloqueada.
    #
    # Quem publica o site é o proxy do host (Nginx/Caddy), que encaminha para esta porta. Este
    # compose não traz proxy próprio: o container serve o build estático em HTTP na porta 80.
    ports:
      - '127.0.0.1:${APP_PORT}:80'
